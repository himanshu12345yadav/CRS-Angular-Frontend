<div class="container-fluid mt-3">
    <h1 class="text-center mb-5">Assign Course to Professor</h1>
    <form #assignProfessorForm="ngForm" (ngSubmit)="assignProfessor()"
        class="row gap-3">
        <div class="form-group">
            <label for="course">Course:</label>
            <select class="form-control" id="course" name="course" required [(ngModel)]="selectedCourse">
                <option *ngFor="let course of courses" [ngValue]="course">{{ course.courseCode }} - {{ course.courseName
                    }}</option>
            </select>
        </div>
        <div class="form-group">
            <label for="professor">Professor:</label>
            <select class="form-control" id="professor" name="professor" required [(ngModel)]="selectedProfessor">
                <option *ngFor="let professor of professors" [ngValue]="professor">{{ professor.username }}</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="!assignProfessorForm.form.valid">Assign</button>
    </form>
</div>
