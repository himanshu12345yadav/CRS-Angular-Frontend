<div class="toolbar" role="banner"
    class="bg-dark text-white d-flex justify-content-center align-items-center gap-3 p-3 fw-medium">
    <a href="/" class="d-flex align-items-center mx-3 mb-md-0 me-md-auto text-white text-decoration-none">
        <span class="fs-4"> <img width="150" alt="Angular Logo"
                src="https://www.signify.com/content/dam/signify/master/crsc/signify-logo-footer.png"
                class="img-fluid justify-self-start" />
        </span>
    </a>
</div>
<div class="container-fluid bg-dark">
    <main class="layout row no-gutters">
        <section class="col-12 col-sm-8 col-md-4 col-lg-2 align-self-start d-flex justify-content-center">
            <div class="d-flex flex-column flex-shrink-0 p-3 text-white" style="width: 280px;">
                <hr>
                <ul class="nav nav-pills flex-column">
                    <li class="nav-item" *ngFor="let route of routes">
                        <a routerLink={{route.name}}
                            [ngClass]="{'nav-link' : true , 'text-white' : true , 'active': this.selectedTab === route.title}"
                            aria-current="page" (click)="changeRoute(route)">
                            <svg class="bi me-2" width="16" height="16">
                                <use xlink:href="#home"></use>
                            </svg>
                            {{route.title}}
                        </a>
                    </li>
                </ul>
                <hr>
            </div>
        </section>
        <div
            class="col-12 col-sm-8 col-md-8 col-lg-10 content d-flex justify-content-center align-items-center text-white">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
